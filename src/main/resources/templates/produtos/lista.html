<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gerenciar Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" sec:authorize="hasRole('GERENTE')" onclick="novoProduto()">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <div id="mensagemProduto" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm mb-4 d-none" id="formularioProduto" sec:authorize="hasRole('GERENTE')">
        <div class="card-body">
            <form id="produtoForm" class="row g-3">
                <input type="hidden" id="produtoId">
                <div class="col-md-4">
                    <label for="nome" class="form-label">Nome do Produto</label>
                    <input type="text" id="nome" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select id="tipo" class="form-select" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Esfiha">Esfiha</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="preco" class="form-label">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control" step="0.01" min="0.01" required>
                </div>
                <div class="col-md-1 d-flex align-items-end">
                    <div class="form-check mb-2">
                        <input type="checkbox" id="ativo" class="form-check-input" checked>
                        <label for="ativo" class="form-check-label">Ativo</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-success">Salvar</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="fecharFormulario()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4" sec:authorize="hasRole('GERENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td>
                            <span class="badge" th:classappend="${produto.ativo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${produto.ativo} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td class="text-end pe-4" sec:authorize="hasRole('GERENTE')">
                            <button class="btn btn-sm btn-outline-primary me-1"
                                    th:data-id="${produto.id}" th:data-nome="${produto.nome}" th:data-tipo="${produto.tipo}"
                                    th:data-preco="${produto.preco}" th:data-ativo="${produto.ativo}"
                                    onclick="editarProduto(this.dataset)">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </button>
                            <button class="btn btn-sm btn-outline-danger" th:data-id="${produto.id}"
                                    onclick="excluirProduto(this.dataset.id)">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('formularioProduto');

        function mostrarMensagem(texto, tipo) {
            const alerta = document.getElementById('mensagemProduto');
            alerta.className = `alert alert-${tipo}`;
            alerta.textContent = texto;
        }

        function novoProduto() {
            document.getElementById('produtoForm').reset();
            document.getElementById('produtoId').value = '';
            formulario.classList.remove('d-none');
        }

        function editarProduto(dados) {
            document.getElementById('produtoId').value = dados.id;
            document.getElementById('nome').value = dados.nome;
            document.getElementById('tipo').value = dados.tipo;
            document.getElementById('preco').value = dados.preco;
            document.getElementById('ativo').checked = dados.ativo === 'true';
            formulario.classList.remove('d-none');
        }

        function fecharFormulario() {
            formulario.classList.add('d-none');
        }

        if (formulario) {
            document.getElementById('produtoForm').addEventListener('submit', async (evento) => {
                evento.preventDefault();
                const id = document.getElementById('produtoId').value;
                const produto = {
                    nome: document.getElementById('nome').value,
                    tipo: document.getElementById('tipo').value,
                    preco: parseFloat(document.getElementById('preco').value),
                    ativo: document.getElementById('ativo').checked
                };
                const response = await fetch(id ? `/api/produtos/${encodeURIComponent(id)}` : '/api/produtos', {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(produto)
                });
                if (response.ok) {
                    window.location.reload();
                } else {
                    mostrarMensagem(await lerErroApi(response), 'danger');
                }
            });
        }

        async function excluirProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) {
                return;
            }
            const response = await fetch(`/api/produtos/${encodeURIComponent(id)}`, { method: 'DELETE' });
            if (response.ok) {
                window.location.reload();
            } else {
                mostrarMensagem(await lerErroApi(response), 'danger');
            }
        }
    </script>
</div>

</body>
</html>
