name: Testes

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reaproveitar o MongoDB embutido
        uses: actions/cache@v4
        with:
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-7.0.14

      - name: Executar os testes
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Gerar resumo
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, glob, xml.etree.ElementTree as ET

          linhas, total, falhas, erros, ignorados, tempo = [], 0, 0, 0, 0, 0.0
          for arquivo in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              suite = ET.parse(arquivo).getroot()
              t, f, e, s = (int(suite.get(c, 0)) for c in ('tests', 'failures', 'errors', 'skipped'))
              total, falhas, erros, ignorados = total + t, falhas + f, erros + e, ignorados + s
              tempo += float(suite.get('time', 0))
              situacao = 'OK' if f + e == 0 else 'FALHOU'
              linhas.append(f"| `{suite.get('name').split('.')[-1]}` | {t} | {f + e} | {situacao} |")

          print('## Resultado dos testes\n')
          print(f'**{total} testes** em {tempo:.1f} s · **{falhas + erros} falha(s)** · {ignorados} ignorado(s)\n')
          print('| Classe | Testes | Falhas | Situação |')
          print('|---|---:|---:|---|')
          print('\n'.join(linhas))

          relatorio = glob.glob('target/site/jacoco/jacoco.csv')
          if relatorio:
              cobertas = perdidas = 0
              with open(relatorio[0]) as arquivo:
                  for linha in csv.DictReader(arquivo):
                      cobertas += int(linha['LINE_COVERED'])
                      perdidas += int(linha['LINE_MISSED'])
              if cobertas + perdidas:
                  print(f'\n**Cobertura de linhas (JaCoCo):** {100 * cobertas / (cobertas + perdidas):.1f}%')
          PY

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 30
